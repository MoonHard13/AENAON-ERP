name: Temporary menu branch CSharp formatter
on:
  push:
    branches:
      - feature/step-9-6a-1-menu-drafts
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'MoonHard13/AENAON-ERP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked solution
        run: dotnet restore AenaonERP.slnx --locked-mode
      - name: Format CSharp using pinned SDK
        run: dotnet format AenaonERP.slnx --no-restore
      - name: Commit formatting back to draft branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests
          git commit -m "style(menu): apply repository dotnet format rules to draft branch"
          git push origin HEAD:feature/step-9-6a-1-menu-drafts
