name: Temporary EF model diff probe
on:
  push:
    branches:
      - feature/step-9-6a-1-menu-drafts
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'MoonHard13/AENAON-ERP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned packages and EF
        run: |
          dotnet restore AenaonERP.slnx --locked-mode
          dotnet tool restore
      - name: Generate model diff without changing the database
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add TemporaryModelDiffProbe \
            --project src/Aenaon.Infrastructure \
            --startup-project src/Aenaon.Api \
            --context AenaonDbContext \
            --output-dir Persistence/Migrations
          echo '========== EF MODEL SNAPSHOT DIFF =========='
          git diff -- src/Aenaon.Infrastructure/Persistence/Migrations/AenaonDbContextModelSnapshot.cs
          echo '========== GENERATED PROBE MIGRATION =========='
          find src/Aenaon.Infrastructure/Persistence/Migrations -name '*TemporaryModelDiffProbe.cs' -print -exec sed -n '1,240p' {} \;
