name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        # Σταθερό commit της έκδοσης v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SDK
        # Σταθερό commit της έκδοσης v6.1.0.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and audit packages
        run: dotnet restore AenaonERP.slnx --locked-mode
      - name: Restore pinned EF tooling
        run: dotnet tool restore
      - name: Verify browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/Aenaon.Api/wwwroot/js/aenaon.js src/Aenaon.Api/wwwroot/js/aenaon-category-picker.js src/Aenaon.Api/wwwroot/js/aenaon-commercial-picker.js src/Aenaon.Api/wwwroot/js/aenaon-theme-init.js; do
            node --check "$file"
          done
      - name: Browser viewport and quick-create smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          node scripts/Test-CategoryPickerBrowser.mjs
          node scripts/Test-CommercialPickerBrowser.mjs
      - name: Verify formatting
        run: dotnet format AenaonERP.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build AenaonERP.slnx --configuration Release --no-restore
      - name: Run integration tests
        run: dotnet test AenaonERP.slnx --configuration Release --no-build --no-restore --filter "TestCategory!=SqlServer"
      - name: Verify Windows PowerShell wrapper syntax
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $aenaonTokens = $null
          $aenaonErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Set-DevelopmentDatabase.ps1'), [ref]$aenaonTokens, [ref]$aenaonErrors) | Out-Null
          if ($aenaonErrors.Count -gt 0) { throw ($aenaonErrors | Out-String) }
      - name: Verify SQL Server 2022 connectivity
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          aenaon_sql_password="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$aenaon_sql_password"
          export MSSQL_SA_PASSWORD="$aenaon_sql_password"
          trap 'docker rm --force aenaon-sql >/dev/null 2>&1 || true' EXIT
          # Επαληθευμένο στιγμιότυπο της επίσημης εικόνας SQL Server 2022.
          docker run --detach --name aenaon-sql --publish 127.0.0.1:14333:1433 --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          export AENAON_RUN_SQL_INTEGRATION=1
          export AENAON_TEST_SQL_CONNECTION="Server=127.0.0.1,14333;Database=master;User ID=sa;Password=$aenaon_sql_password;Encrypt=True;TrustServerCertificate=True;"
          dotnet test tests/Aenaon.Infrastructure.Tests --configuration Release --no-build --no-restore --filter "TestCategory=SqlServer"
      - name: Publish API
        run: dotnet publish src/Aenaon.Api --configuration Release --no-restore --self-contained false --output artifacts/api
      - name: Check published API over HTTPS
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: artifacts/api
        run: |
          aenaon_certificate="$RUNNER_TEMP/aenaon-development.pem"
          dotnet dev-certs https --export-path "$aenaon_certificate" --format PEM
          ASPNETCORE_ENVIRONMENT=Development dotnet Aenaon.Api.dll --urls "https://localhost:7140" > "$RUNNER_TEMP/aenaon-api.log" 2>&1 &
          aenaon_api_pid=$!
          trap 'kill "$aenaon_api_pid" 2>/dev/null || true' EXIT
          aenaon_health="$(curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --cacert "$aenaon_certificate" https://localhost:7140/health)"
          test "$aenaon_health" = "Healthy"
