name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        # Σταθερό commit της έκδοσης v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install SDK
        # Σταθερό commit της έκδοσης v6.1.0.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore and audit packages
        run: dotnet restore AenaonERP.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format AenaonERP.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build AenaonERP.slnx --configuration Release --no-restore
      - name: Run integration tests
        run: dotnet test AenaonERP.slnx --configuration Release --no-build --no-restore
      - name: Publish API
        run: dotnet publish src/Aenaon.Api --configuration Release --no-restore --self-contained false --output artifacts/api
      - name: Check published API over HTTPS
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: artifacts/api
        run: |
          aenaon_certificate="$RUNNER_TEMP/aenaon-development.pem"
          dotnet dev-certs https --export-path "$aenaon_certificate" --format PEM
          ASPNETCORE_ENVIRONMENT=Development dotnet Aenaon.Api.dll --urls "https://localhost:7140" > "$RUNNER_TEMP/aenaon-api.log" 2>&1 &
          aenaon_api_pid=$!
          trap 'kill "$aenaon_api_pid" 2>/dev/null || true' EXIT
          aenaon_health="$(curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --cacert "$aenaon_certificate" https://localhost:7140/health)"
          test "$aenaon_health" = "Healthy"
